<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6fbff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>LUCK GRAB</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="hero" aria-label="LUCK GRAB">
      <div class="decor balloon balloon-a"></div>
      <div class="decor balloon balloon-b"></div>
      <div class="decor balloon balloon-c"></div>
      <div class="decor loop loop-a"></div>
      <div class="decor loop loop-b"></div>

      <header class="title-wrap">
        <h1>LUCK GRAB</h1>
        <p>숨겨진 행운 메시지를 찾아보세요!</p>
      </header>

      <div class="machine-wrap">
        <div class="machine">
          <div class="machine-top"></div>

          <div class="cabinet" id="cabinet">
            <div class="glass-shine shine-a"></div>
            <div class="glass-shine shine-b"></div>
            <div class="inner-back"></div>
            <div class="top-rail"></div>
            <div class="vertical-guide" id="verticalGuide"></div>

            <div class="claw" id="claw" aria-hidden="true">
              <div class="claw-carriage"></div>
              <div class="claw-cable"></div>
              <div class="claw-body"></div>
              <div class="claw-arms">
                <span class="arm arm-left"></span>
                <span class="arm arm-right"></span>
              </div>
            </div>

            <div class="ball-pit" id="ballPit" aria-hidden="true"></div>
            <div class="floor-glow"></div>
          </div>

          <div class="machine-base">
            <div class="joystick-zone">
              <div class="joystick" id="joystick" tabindex="0" role="application" aria-label="조이스틱">
                <div class="joy-ring"></div>
                <div class="joy-shaft" id="joyShaft"></div>
                <div class="joy-ball" id="joyBall"></div>
              </div>
            </div>

            <div class="button-zone" aria-label="방향 및 그랩 버튼">
              <div class="direction-grid">
                <button class="arcade-btn blue" id="upButton" type="button" aria-label="위로">▲</button>
                <button class="arcade-btn green" id="leftButton" type="button" aria-label="왼쪽">◀</button>
                <button class="arcade-btn yellow" id="downButton" type="button" aria-label="아래로">▼</button>
                <button class="arcade-btn red" id="rightButton" type="button" aria-label="오른쪽">▶</button>
              </div>
              <button class="grab-btn" id="grabButton" type="button" aria-label="그랩">GRAB</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="result-layer" id="resultLayer" hidden>
    <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <div class="result-ball" id="resultBall"><span>★</span></div>
      <p class="result-kicker">오늘의 메시지</p>
      <h2 id="resultTitle">행운의 한마디</h2>
      <blockquote id="quoteText"></blockquote>
      <button id="continueButton" type="button">다시 뽑기</button>
    </div>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e7e7e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Lucky Grab</title>
  <link rel="stylesheet" href="./style-v3.css?v=20260930-3" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>LUCKY GRAB</h1>
        
      </div>
      <div class="status-pill"><span class="status-dot"></span><span id="actionStatus">READY</span></div>
    </header>

    <section class="game-card" aria-label="공 뽑기 게임 화면">
      <div class="cabinet" id="cabinet">
        <div class="glass-glow glass-glow-a"></div>
        <div class="glass-glow glass-glow-b"></div>
        <div class="rear-panel"></div>
        <div class="rail-x"></div>

        <div class="claw" id="claw" aria-hidden="true">
          <div class="carriage"><span></span><span></span></div>
          <div class="cable"></div>
          <div class="claw-neck"></div>
          <div class="claw-head"></div>
          <div class="claw-arms">
            <i class="arm arm-left"></i>
            <i class="arm arm-right"></i>
          </div>
        </div>

        <div class="ball-pit" id="ballPit" aria-hidden="true"></div>

        <div class="hud hud-left"><span>SCORE</span><strong id="score">000</strong></div>
        <div class="hud hud-right"><span>BALLS</span><strong id="ballCount">20</strong></div>
        <div class="floor-edge"></div>
      </div>
    </section>

    <section class="control-card" aria-label="게임 조작부">
      <div class="control-copy">
        <div>
          <p class="control-label">CONTROL PANEL</p>
          <h2>LUCKY GRAB</h2>
        </div>
      </div>

      <div class="controller-grid">
        <div class="arcade-panel">
          <div class="arcade-base" id="joystick" role="application" aria-label="조이스틱 컨트롤러" tabindex="0">
            <div class="base-shadow"></div>
            <div class="base-top"></div>
            <div class="stick-gate"></div>
            <div class="stick-shaft"></div>
            <div class="stick-ball" id="stick"></div>
            <button class="mini-button mini-green" id="resetButton" type="button" aria-label="게임 초기화"></button>
            <button class="mini-button mini-red" id="grabButton" type="button" aria-label="공 뽑기"></button>
            <button class="mini-button mini-blue" id="centerButton" type="button" aria-label="집게 가운데로"></button>
          </div>
          <div class="arcade-legend">
            <span><i class="dot green"></i>RESET</span>
            <span><i class="dot red"></i>GRAB</span>
            <span><i class="dot blue"></i>CENTER</span>
          </div>
        </div>

        <div class="info-panel">
          <div class="info-card">
            <span>현재 점수</span>
            <strong id="scoreMirror">000</strong>
          </div>
          <div class="info-card">
            <span>남은 볼</span>
            <strong id="ballCountMirror">20</strong>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="result-layer" id="resultLayer" hidden>
    <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <div class="result-ball" id="resultBall"><span>★</span></div>
      <p class="result-kicker">오늘의 메시지</p>
      <h2 id="resultTitle">오늘의 한마디</h2>
      <blockquote id="quoteText">오늘도 당신에게는 다시 시작할 수 있는 힘이 있습니다.</blockquote>
      <p class="result-count" id="quoteCounter"></p>
      <button id="continueButton" type="button">다시 뽑기</button>
    </div>
  </div>

  <script src="./app-v3.js?v=20260930-3" defer></script>
</body>
</html>
